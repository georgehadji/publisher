services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: publisher
      POSTGRES_USER: publisher
      POSTGRES_PASSWORD: publisher
      # Local dev/test only -- trust auth over the compose network. Real
      # deployments get credentials from a secrets manager, not this file.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # 55432, not 5432: a locally-installed PostgreSQL service commonly owns
      # 5432, and when it does, everything host-side (notably the integration
      # tests) silently connects to THAT database instead of this one -- the
      # tests then assert against a store the worker never writes to. Services
      # inside the compose network still reach postgres:5432 as normal.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publisher"]
      interval: 2s
      timeout: 5s
      retries: 15
    # U8 bulkhead: bound each service's footprint so one container running
    # hot cannot starve or OOM the others on the same host.
    mem_limit: 1g
    cpus: 1.0
    # E3.1: on both networks -- `default` (so `api` keeps reaching it
    # unchanged) and `dbnet` (so the egress-isolated `worker` can too).
    networks:
      - default
      - dbnet

  # E4.1: applies pending platform/db/migrations/*.sql (see migrate.ts) before
  # worker/api ever start -- the old docker-entrypoint-initdb.d mount only
  # ever ran against an EMPTY data directory, so an existing deployment (this
  # one, once `pgdata` is no longer fresh) had no path to a schema change.
  # Connects as `publisher`, the owner/superuser role -- it is the only
  # service allowed to (it creates the E4.3 roles and RLS policies below).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://publisher:publisher@postgres:5432/publisher
    command: ["node", "packages/api/dist/migrate.js"]
    networks:
      - dbnet
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot job, not a server -- it must be allowed to exit 0 and stay
    # exited, never restarted, or `docker compose up -d` would treat its own
    # successful completion as a crash loop.
    restart: "no"

  # E3.1/E6.2 -- the ONLY route out of dbnet's `internal: true` isolation.
  # See infra/llm-egress/tinyproxy.conf for what it allows and why.
  #
  # Two networks, not one -- `llm-egress` alone is ALSO `internal: true`
  # (below), so simply joining it grants no route to the internet at all.
  # Real connectivity comes ONLY from `llm-egress-uplink`, which ONLY this
  # service is on. A worker container joining `llm-egress` therefore reaches
  # this proxy and NOTHING past it; the proxy is the one thing standing with
  # a foot in both networks. (Caught empirically: an earlier version of this
  # file put the worker on a single non-internal `llm-egress` network, which
  # gave the WORKER a direct internet route via that network's own gateway
  # regardless of HTTPS_PROXY -- an application-level convention, not a
  # network-level control -- completely defeating the point.)
  llm-egress-proxy:
    build:
      context: infra/llm-egress
    networks:
      - llm-egress
      - llm-egress-uplink
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      # E4.3: not the owner/superuser `publisher` -- an unprivileged role RLS
      # (E4.2) actually constrains. `_claim_build` (worker.py) SET ROLEs into
      # publisher_worker_claim for just its cross-tenant claim query.
      DATABASE_URL: postgresql://publisher_worker:publisher_worker@postgres:5432/publisher
      PUBLISHER_CAS_ROOT: /data/cas
      # Which render path the derived DAG binds: `css` (weasyprint) or `typst`
      # (pandoc -> Typst). Both toolchains are in the worker image; this only
      # chooses between them. See README "Render paths".
      PUBLISHER_RENDER_ENGINE: ${PUBLISHER_RENDER_ENGINE:-css}
      # Opt in to the InDesign deliverable (terminal `idml` stage; needs pandoc,
      # already in the image). Off by default: a build must not fail for want of
      # a file nobody ordered.
      PUBLISHER_EMIT_IDML: ${PUBLISHER_EMIT_IDML:-}
      # E6.2 -- unset by default, which is what keeps structure-infer
      # unreachable (worker.py only supplies its root input when this is
      # set): "cleanly absent when credentials are not supplied" is a
      # property of THIS variable being empty, not of any code path.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # `urllib.request`'s default opener honors these automatically
      # (OpenRouterProvider, services/structure/publisher_structure/
      # inference.py, sets no proxy of its own) -- routing through
      # llm-egress-proxy instead of a direct connection is what makes the
      # allowlist actually apply, not just exist.
      HTTPS_PROXY: http://llm-egress-proxy:8888
      HTTP_PROXY: http://llm-egress-proxy:8888
      # Without this, Python buffers stdout when it is a pipe, so `docker compose
      # logs worker` stayed empty for the whole of a build -- the per-stage prints
      # only appeared if the process exited.
      PYTHONUNBUFFERED: "1"
      # Nothing under a read-only rootfs can persist a bytecode cache anyway;
      # avoid the wasted (harmless, but repeated every start) write attempt.
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - cas-data:/data/cas
    # E3.1: the worker parses tenant-uploaded archives through libreoffice,
    # weasyprint and ghostscript -- a hostile document exploiting any of them
    # should not be able to persist anything, escalate privileges, or reach
    # the network. `USER 10001` (Dockerfile.worker) removes root; everything
    # below removes what root would otherwise still be able to do.
    read_only: true
    tmpfs:
      # noexec/nosuid/nodev: this is scratch space for a build's own temp
      # files (publisher_exec's tempfile.TemporaryDirectory, ghostscript's
      # intermediates), never a place anything needs to execute from.
      - /tmp:size=2g,noexec,nosuid,nodev
      # LibreOffice's `-env:UserInstallation=` already points its profile at
      # the build's own /tmp scratch dir (stages/ingest_stage.py
      # `_convert_legacy_doc`), but it can still probe $HOME for other
      # writes (as does fontconfig's per-user cache) -- give it one, sized
      # well under the tmpfs above. Docker's tmpfs default is root:root
      # mode 0700 for any path other than /tmp itself (which it special-
      # cases to the standard 1777) -- verified against a real build: without
      # `uid=`/`gid=` here, uid 10001 could not even list its own $HOME,
      # and weasyprint/Pango logged "Fontconfig error: No writable cache
      # directories" (harmless -- it falls back to uncached lookups -- but
      # noisy on every real render).
      - /home/publisher:size=256m,nosuid,nodev,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # `postgres` joins both this network and the default one, so `api`
    # (unchanged, still on default) keeps reaching it. `worker` reaches
    # postgres via dbnet and NOTHING ELSE there -- dbnet is still
    # `internal: true` (E3.1). `llm-egress` is the one narrow exception
    # (E6.2): it reaches the allowlist proxy, never the internet directly.
    networks:
      - dbnet
      - llm-egress
    # Postgres restarting used to leave the queue permanently undrained: the
    # worker exited and nothing brought it back.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llm-egress-proxy:
        condition: service_started
    # U8 bulkhead: the worker is the memory risk in this stack -- Weasyprint on
    # a 900-page manuscript is effectively unbounded RAM (ARCHITECTURE_UPLIFT_PLAN.md
    # U8), and one such build must not be able to OOM the host and take the API
    # down with it. A build that legitimately needs more than this dies loudly
    # (OOMKilled, recorded 'failed' by the next worker's lease reclaim) instead
    # of silently degrading everything else. Raise this per-host, not by removing it.
    mem_limit: 3g
    cpus: 2.0

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # E4.3: not the owner/superuser `publisher` -- an unprivileged role RLS
      # (E4.2) actually constrains. `withTenant` (db.ts) sets app.tenant_id
      # from the caller's auth-resolved tenant before every tenant-table query.
      DATABASE_URL: postgresql://publisher_app:publisher_app@postgres:5432/publisher
      # /v1/admin/metrics (admin.ts) reports GLOBAL aggregates across every
      # tenant by design -- it is gated by its own admin-token check, not a
      # tenant token, so there is no app.tenant_id to scope it by. A separate
      # bypass-RLS role keeps that cross-tenant visibility confined to
      # exactly the one route that is supposed to have it.
      PUBLISHER_ADMIN_DATABASE_URL: postgresql://publisher_admin:publisher_admin@postgres:5432/publisher
      PORT: "4000"
      HOST: "0.0.0.0"
      # E5.3 -- the value is an argon2id hash, not the plaintext token; the
      # bearer credential this hashes is "dev-token" (generate a new one with
      # `npm run hash-token -- <token>` in packages/api). Every literal `$`
      # is doubled to `$$` -- docker compose interpolates a bare `$word` as
      # an env-var reference, which would otherwise silently mangle the hash.
      PUBLISHER_API_TOKENS: "$$argon2id$$v=19$$m=65536,p=4,t=3$$mtODaDMmGidL1PGeKI/Olw$$VhzhV2ETLRLHJypvXfceZ3Wal5yKjGIru+DhsF0a+TU:dev-tenant"
      PUBLISHER_CORS_ORIGINS: "http://localhost:3000"
      # The API serves artifact bytes out of the CAS the worker wrote them to.
      # Without this mount it resolved the default relative ./.publisher/cas
      # inside its own container, and every download 500'd with ENOENT.
      # Read-only: the API reads blobs, it never produces them.
      PUBLISHER_CAS_ROOT: /data/cas
    volumes:
      # U2: the API now WRITES to CAS -- the upload route streams manuscript
      # bytes into it (PUT /v1/manuscripts/:id/upload). The :ro this volume had
      # predates that route; it made every upload 500 with ENOENT on
      # .upload-tmp. Reads are still the common path, but the API is a CAS
      # producer now.
      - cas-data:/data/cas
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # U8 bulkhead: the API never renders anything -- CAS_READ_MAX_BYTES (db.ts)
    # already bounds a single read, so this only needs to survive a burst of
    # concurrent requests, not a single huge one.
    mem_limit: 512m
    cpus: 1.0

networks:
  # E3.1: internal -- no default gateway to the internet for anything on it.
  # Published `ports:` mappings (postgres's 55432, api's 4000) are host-side
  # DNAT and work regardless; `internal` only removes the container's OWN
  # route out.
  dbnet:
    internal: true
  # E6.2: internal, same as dbnet -- this is the worker-facing side of the
  # proxy. It grants no internet route on its own; see llm-egress-uplink,
  # which only llm-egress-proxy joins, for where the proxy's OWN real
  # connectivity comes from. `worker` is the only other member of this one.
  llm-egress:
    internal: true
  # E6.2: NOT internal -- the proxy's actual route to the internet.
  # llm-egress-proxy is the ONLY service that ever joins this network; if a
  # future edit adds anything else to it, that thing gets an unfiltered
  # route out, which is exactly the mistake this topology exists to prevent.
  llm-egress-uplink:

volumes:
  pgdata:
  cas-data:
