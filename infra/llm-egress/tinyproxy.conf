# Publisher -- LLM egress allowlist proxy (E3.1/E6.2, docs/ARCHITECTURE_SCORE_10_PLAN.md).
#
# E3.1 put the worker container on a network with NO route to the internet
# at all (`dbnet: internal: true`, docker-compose.yml) because the only
# thing that would ever need outbound access -- the cover/LLM inference
# path -- was unreachable in production. E6.2 wires that path (structure-infer,
# stages/structure_infer_stage.py), so it now genuinely needs egress -- but
# giving the WHOLE worker container an open route to the internet would
# reopen exactly the SSRF surface (T4) E3.1 closed: a compromised or buggy
# stage handling a hostile upload could reach anywhere. Instead, the worker
# gets a second network (`llm-egress`, NOT internal) whose only other member
# is this proxy, and every outbound call is forced through it and its
# allowlist -- `dbnet` itself stays exactly as closed as E3.1 left it.
#
# Verified empirically before wiring this into docker-compose.yml: a request
# for an allowed host gets a real response through the proxy; a request for
# anything else gets a 403 with "Proxying refused on filtered domain" in
# this container's own logs.
# No User/Group directive: the container itself already runs as a fixed
# non-root uid (the Dockerfile's own USER 10001:10001), so tinyproxy has
# nothing further to drop, and no CAP_SETUID/CAP_SETGID to do it with under
# docker-compose.yml's cap_drop: [ALL] on this service.
Port 8888
Listen 0.0.0.0
Timeout 30
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Info
MaxClients 100
ViaProxyName "publisher-llm-egress"

# Allowlist, not denylist -- FilterDefaultDeny means every host NOT matched
# by allowed-hosts.txt is refused, which is what makes this an SSRF control
# rather than a convenience. `FilterExtended` is deprecated in favor of
# `FilterType` in newer tinyproxy releases (a warning, not an error, on the
# version this was verified against) -- kept for now since it is the form
# actually verified to work; revisit if a future tinyproxy drops it outright.
Filter "/etc/tinyproxy/allowed-hosts.txt"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

# Only reachable from containers on the llm-egress network at all (docker-
# compose.yml), so this is defense in depth, not the primary boundary.
Allow 0.0.0.0/0
