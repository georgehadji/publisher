# Publisher CI — matches BUILD_PLAN.md declared gates.
#
# ARCHITECTURE.md §2.15 lists Schema lint, Stage contract, DAG integrity and contract
# tests as "CI blocking". They previously all carried `continue-on-error: true`, so every
# doctrine gate was advisory and the pipeline stayed green regardless of what they found.
# Two of them could not have failed anyway: DAG integrity was invoked as
# `python -m platform.stages.integrity`, which cannot work because the repo's top-level
# `platform/` directory shadows the stdlib `platform` module, and the version-bump lint
# swallowed all of its own errors. Both are fixed; the gates are now enforced.
name: ci
on:
  push:
    # `master` is this repo's default branch. The workflow previously listed only
    # `main`, so it never ran on any push.
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Every editable install the suite needs. services/cover, services/idml,
  # services/epub and services/onix were missing, so any test importing them
  # would fail to collect in CI while passing locally.
  PUBLISHER_PKGS: >-
    -e platform/cas/py -e platform/stages/py -e platform/cache/py
    -e platform/exec/py -e platform/sandbox/py -e platform/reproducibility
    -e platform/supply-chain
    -e services/prepress -e services/structure -e services/agents
    -e services/ingest -e services/cover -e services/idml
    -e services/epub -e services/onix -e services/alttext

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # E2.2/E3.2 interaction found verifying E3.1 against a real build:
      # deadline_mw runs a stage on a background thread, and glibc gives a
      # new thread its own malloc arena (tens of MB, reserved via mmap) on
      # its first allocation -- exactly what memory_mw's RLIMIT_AS exists to
      # block. Without this, a realistic budget can make the WATCHDOG
      # THREAD's own first allocation fail, surfacing as a garbled parse
      # error instead of a clean MemoryError. See memory_mw's docstring
      # (platform/exec/py/publisher_exec/__init__.py) for the full story;
      # this runner hits the same threaded chain Dockerfile.worker does.
      MALLOC_ARENA_MAX: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: publisher
          POSTGRES_USER: publisher
          POSTGRES_PASSWORD: publisher
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ${{ env.PUBLISHER_PKGS }} psycopg2-binary requests
      - name: Load schema
        # GitHub's `services:` Postgres has no init-script mount (unlike
        # docker-compose.yml's `/docker-entrypoint-initdb.d/`), so CI applies
        # schema.sql itself. psycopg2, not psql, to avoid a new tool dependency.
        run: |
          python <<'PY'
          import pathlib
          import psycopg2
          conn = psycopg2.connect("postgresql://publisher:publisher@localhost:55432/publisher")
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(pathlib.Path("platform/db/schema.sql").read_text())
          print("schema loaded")
          PY
      - name: Full test suite
        # `-rs` prints skip reasons. A CI run where the 24 Postgres-backed
        # integration tests silently skip is indistinguishable from one where
        # they passed (E0.3) -- so a skip for that reason fails the job even
        # though pytest itself exits 0 for a skip.
        run: |
          python -m pytest --tb=short -rs | tee pytest-output.txt
          ! grep -q "Postgres is not listening" pytest-output.txt
      - name: Lint schemas (no free-text in structure routes)
        run: python tools/lint_schemas.py

  node:
    # E0.4 -- packages/api had 3.3k LOC including the entire auth/tenancy
    # boundary and zero test files; neither `vitest` nor `tsc --noEmit` ran
    # in CI despite both being configured in package.json. The auth-matrix
    # and route-coverage tests use Fastify's in-process `.inject()`, not a
    # real socket or database, so this job needs no Postgres service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run lint
      - name: Vitest -- auth matrix, route coverage, CAS hardening
        run: npm run test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test
      - run: cargo clippy -- -D warnings

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump lint diffs against a base revision, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ${{ env.PUBLISHER_PKGS }} import-linter
      - name: Codegen in sync (§3.1 Done)
        run: |
          cd schemas && node codegen/generate.mjs && cd ..
          git diff --exit-code
      - name: Generated types are valid (§3.1)
        run: cd schemas && node codegen/test.mjs
      - name: DAG integrity (§3.20)
        # NOT `python -m platform.stages.integrity` — see the header note.
        run: python platform/stages/integrity.py
      - name: Generated contract tests (§3.20)
        run: python -m pytest tests/contracts -v
      - name: Version-bump rule (§3.3, §7)
        run: python tools/lint_stage_versions.py "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: Service deps declared (U3)
        run: python tools/lint_service_deps.py
      - name: Import boundaries (E1.4)
        run: lint-imports --config .importlinter

  supply-chain:
    # E3.5 -- pip-audit and npm audit are gates (non-zero exit fails the job);
    # the SBOM is an artifact, not a gate, because there is no CVE-count
    # threshold defined yet to fail it against (platform/supply-chain's
    # CveGate is a placeholder -- see that module's own docstring).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (requirements.lock)
        # --require-hashes is also implied by the file having --hash entries
        # at all; spelled out so a future edit that drops hashes fails loudly
        # here instead of silently auditing an unpinned tree.
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.lock --require-hashes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci (api)
        working-directory: packages/api
        run: npm ci
      - name: npm audit --audit-level=high (api)
        working-directory: packages/api
        run: npm audit --audit-level=high
      - name: npm ci (web)
        working-directory: packages/web
        run: npm ci
      - name: npm audit --audit-level=high (web)
        working-directory: packages/web
        run: npm audit --audit-level=high
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
