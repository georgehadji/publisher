# Publisher CI — matches BUILD_PLAN.md declared gates.
#
# ARCHITECTURE.md §2.15 lists Schema lint, Stage contract, DAG integrity and contract
# tests as "CI blocking". They previously all carried `continue-on-error: true`, so every
# doctrine gate was advisory and the pipeline stayed green regardless of what they found.
# Two of them could not have failed anyway: DAG integrity was invoked as
# `python -m platform.stages.integrity`, which cannot work because the repo's top-level
# `platform/` directory shadows the stdlib `platform` module, and the version-bump lint
# swallowed all of its own errors. Both are fixed; the gates are now enforced.
name: ci
on:
  push:
    # `master` is this repo's default branch. The workflow previously listed only
    # `main`, so it never ran on any push.
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Every editable install the suite needs. services/cover, services/idml,
  # services/epub and services/onix were missing, so any test importing them
  # would fail to collect in CI while passing locally.
  PUBLISHER_PKGS: >-
    -e platform/cas/py -e platform/stages/py -e platform/cache/py
    -e platform/exec/py -e platform/sandbox/py -e platform/reproducibility
    -e platform/supply-chain
    -e platform/orchestration/py
    -e services/prepress -e services/structure -e services/agents
    -e services/ingest -e services/cover -e services/idml
    -e services/epub -e services/onix -e services/alttext

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # E2.2/E3.2 interaction found verifying E3.1 against a real build:
      # deadline_mw runs a stage on a background thread, and glibc gives a
      # new thread its own malloc arena (tens of MB, reserved via mmap) on
      # its first allocation -- exactly what memory_mw's RLIMIT_AS exists to
      # block. Without this, a realistic budget can make the WATCHDOG
      # THREAD's own first allocation fail, surfacing as a garbled parse
      # error instead of a clean MemoryError. See memory_mw's docstring
      # (platform/exec/py/publisher_exec/__init__.py) for the full story;
      # this runner hits the same threaded chain Dockerfile.worker does.
      MALLOC_ARENA_MAX: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: publisher
          POSTGRES_USER: publisher
          POSTGRES_PASSWORD: publisher
          # As docker-compose.yml: the least-privilege roles migration 003
          # creates are reached by password-less DSNs in the integration
          # tests (e.g. `publisher_app:x@`), which only `trust` admits.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render toolchain and Python dependencies (the lock, by hash)
        # The suite needs what the worker has: weasyprint's Pango stack,
        # Ghostscript, pdfimages, the house face, and requirements.lock. The
        # packages' own pyproject.toml declare almost nothing (by convention),
        # so installing them alone left weasyprint, python-docx and pytest
        # itself missing -- and the suite step still passed (see below).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 ghostscript poppler-utils fonts-gfs-didot
          pip install -r requirements.lock --require-hashes
          pip install pytest==8.4.2
      - run: pip install ${{ env.PUBLISHER_PKGS }} psycopg2-binary requests import-linter
      - name: pandoc 3.5 and typst 0.13.1, pinned (as Dockerfile.worker)
        # The Typst render path's tests skip without them, and a build in
        # test_api_drives_pipeline runs paginate-typst once a sibling test has
        # registered it. Same assets and digests as Dockerfile.worker, so CI
        # renders with the image's versions, not whatever Ubuntu ships.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            https://github.com/jgm/pandoc/releases/download/3.5/pandoc-3.5-1-amd64.deb
          echo "4f41d817d262ef3d17953a3e6e0fefddb971aa4f2f121544a9a86db449d945e1  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          pandoc --list-output-formats | grep -qx typst
          typst --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: EPUBCheck 5.4.0, pinned (W10)
        # So test_epubcheck_accepts_the_epub runs instead of skipping: the EPUB
        # is checked by the validator retailers use, not only by our own text
        # comparison. Pinned by digest -- the jar and the lib/ tree it loads.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/epubcheck-5.4.0"
          echo "2146665a124998dc6c908010ffe0d09dc4f4c8014f2c8fd6a1aa11f64c40ac93  epubcheck.jar" | sha256sum -c -
          test "$(cd lib && LC_ALL=C sha256sum *.jar | sha256sum | cut -d' ' -f1)" = \
            547d8494b76396683c7ce2e8bc1fd124a8db5a72c93f4ed64d34cd51e6d3328d
          echo "PUBLISHER_EPUBCHECK_JAR=$PWD/epubcheck.jar" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DAISY ACE 1.4.6, pinned (W10)
        # So test_ace_finds_no_serious_violation runs instead of skipping. ACE's
        # CLI starts Electron, which needs an X display even to print its
        # version (first CI run: "Missing X server or $DISPLAY", SIGSEGV), so
        # it runs under xvfb-run through a wrapper. Ubuntu 24.04's AppArmor
        # forbids the unprivileged user namespaces Chromium's sandbox needs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }
          npm install -g @daisy/ace@1.4.6
          printf '#!/bin/sh\nexec xvfb-run -a ace "$@"\n' > "$RUNNER_TEMP/ace-xvfb"
          chmod +x "$RUNNER_TEMP/ace-xvfb"
          "$RUNNER_TEMP/ace-xvfb" --version | grep -qx 1.4.6
          echo "PUBLISHER_ACE=$RUNNER_TEMP/ace-xvfb" >> "$GITHUB_ENV"
      - name: Node dependencies the suite drives (api via tsx)
        # The API integration tests start packages/api with its own tsx.
        run: npm ci --prefix packages/api
      - name: Load schema
        # GitHub's `services:` Postgres has no init-script mount (unlike
        # docker-compose.yml's `/docker-entrypoint-initdb.d/`), so CI applies
        # every platform/db/migrations/*.sql file itself, in order -- the same
        # files `packages/api/src/migrate.ts` applies via the `migrate`
        # compose service (E4.1). psycopg2, not psql, to avoid a new tool
        # dependency; no schema_migrations bookkeeping needed for a single
        # fresh-container run.
        run: |
          python <<'PY'
          import pathlib
          import psycopg2
          conn = psycopg2.connect("postgresql://publisher:publisher@localhost:55432/publisher")
          conn.autocommit = True
          for f in sorted(pathlib.Path("platform/db/migrations").glob("*.sql")):
              with conn.cursor() as cur:
                  cur.execute(f.read_text())
              print(f"applied {f.name}")
          PY
      - name: Full test suite
        # `-rs` prints skip reasons. A CI run where the 24 Postgres-backed
        # integration tests silently skip is indistinguishable from one where
        # they passed (E0.3) -- so a skip for that reason fails the job even
        # though pytest itself exits 0 for a skip.
        # `pipefail`: GitHub's default `bash -e` takes a pipeline's status from
        # its LAST command, so `pytest | tee` passed whatever pytest did. It
        # passed "No module named pytest" on every run before this line.
        run: |
          set -o pipefail
          python -m pytest --tb=short -rs | tee pytest-output.txt
          ! grep -q "Postgres is not listening" pytest-output.txt
          ! grep -q "set PUBLISHER_EPUBCHECK_JAR" pytest-output.txt
          ! grep -q "set PUBLISHER_ACE" pytest-output.txt
      - name: Lint schemas (no free-text in structure routes)
        run: python tools/lint_schemas.py

  node:
    # E0.4 -- packages/api had 3.3k LOC including the entire auth/tenancy
    # boundary and zero test files; neither `vitest` nor `tsc --noEmit` ran
    # in CI despite both being configured in package.json. The auth-matrix
    # and route-coverage tests use Fastify's in-process `.inject()`, not a
    # real socket or database, so this job needs no Postgres service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npm run lint
      - name: Vitest -- auth matrix, route coverage, CAS hardening
        run: npm run test

  web:
    # packages/web got `npm ci` and `npm audit` (supply-chain, below) and
    # nothing else, so a type error in the review UI reached master unseen --
    # the structure panel once read `ChapterReview.id`, a field the API never
    # sends, and would have thrown on first render. `next build` type-checks
    # (its "Running TypeScript" step fails on TS2339 for exactly that bug) and
    # compiles every route. It needs no env: the review page is dynamic, so the
    # API is not called at build time.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type-check and build (next build)
        run: npm run build
      - name: Vitest -- review actions vs overrides/1, panel states
        # Every refusal path of the Server Actions (public POST endpoints), and
        # every op a form builds validated against overrides/1 itself.
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test
      - run: cargo clippy -- -D warnings

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump lint diffs against a base revision, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock --require-hashes && pip install pytest==8.4.2
      - run: pip install ${{ env.PUBLISHER_PKGS }} import-linter
      - name: Codegen in sync (§3.1 Done)
        run: |
          cd schemas && node codegen/generate.mjs && cd ..
          git diff --exit-code
      - name: Generated types are valid (§3.1)
        run: cd schemas && node codegen/test.mjs
      - name: DAG integrity (§3.20)
        # NOT `python -m platform.stages.integrity` — see the header note.
        run: python platform/stages/integrity.py
      - name: Generated contract tests (§3.20)
        run: python -m pytest tests/contracts -v
      - name: Version-bump rule (§3.3, §7)
        run: python tools/lint_stage_versions.py "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: Service deps declared (U3)
        run: python tools/lint_service_deps.py
      - name: Import boundaries (E1.4)
        run: lint-imports --config .importlinter
      - name: Tenant scoping (E4.3)
        run: python tools/lint_tenant_scoping.py
      - name: Docs claims (E7.3)
        run: python tools/lint_docs_claims.py

  supply-chain:
    # E3.5 -- pip-audit and npm audit are gates (non-zero exit fails the job);
    # the SBOM is an artifact, not a gate: these two audits are the CVE gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (requirements.lock)
        # --require-hashes is also implied by the file having --hash entries
        # at all; spelled out so a future edit that drops hashes fails loudly
        # here instead of silently auditing an unpinned tree. No advisory is
        # accepted: the three weasyprint 62.3 carried were cleared by 70.0.
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.lock --require-hashes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci (api)
        working-directory: packages/api
        run: npm ci
      - name: npm audit --audit-level=high (api)
        working-directory: packages/api
        run: npm audit --audit-level=high
      - name: npm ci (web)
        working-directory: packages/web
        run: npm ci
      - name: npm audit --audit-level=high (web)
        working-directory: packages/web
        run: npm audit --audit-level=high
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
