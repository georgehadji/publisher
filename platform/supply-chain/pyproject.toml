[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-supply-chain"
version = "0.1.0"
description = "Supply chain security — SBOM, CVE gates, dependency scanning"
requires-python = ">=3.12"
dependencies = []
optional-dependencies = {test = ["pytest>=8.0"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_supply_chain*"]
