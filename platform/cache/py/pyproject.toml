[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-cache"
version = "0.1.0"
description = "Build-graph memoization — cache key computation and hit/miss management"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_cache*"]
