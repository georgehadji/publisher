# Greek trade book trim sizes.
#
# Greek publishers spec trim in whole centimetres rather than the inch-derived
# sizes the US profiles carry (6x9in = 152.4x228.6mm), so these are exact:
# 17x24cm is 170x240mm, not a rounded conversion of anything.
#
# All four declare bleed 3mm on every side. Unlike the generic profile -- where
# that requirement went unmet because the renderer laid pages out at exactly
# trim -- `design-compile` now grows the page box to trim + 2x bleed and
# `finish` insets the TrimBox back to trim, so the bleed these declare is the
# bleed the press file actually carries.
schema: profile/1
name: Greek 17x24
vendor: greek
vendorProfileVersion: "1.0"
trimSize:
  width: 170.0
  height: 240.0
  unit: mm
bleed:
  all: 3.0
pdfSpec:
  version: "1.7"
  standard: pdfx-1a
  colorSpace: cmyk
coverSpec:
  paperType: matte
  ink: full-color
  finish: perfect-bound
proofSpec:
  watermark: false
  dpi: 300
  sizeBudgetBytes: 100000000
minPages: 1
maxPages: 2000
pageSizeMultiple: 1
