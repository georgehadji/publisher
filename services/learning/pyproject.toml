[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-learning"
version = "0.1.0"
description = "Publisher learning system — L1/L2/L3 memory hierarchy, promotion, calibration"
requires-python = ">=3.12"
dependencies = []
optional-dependencies = {test = ["pytest>=8.0"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_learning*"]
