[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-agents"
version = "0.1.0"
description = "Publisher agent layer — Structure Wrangler, Compositor, Preflight Explainer"
requires-python = ">=3.12"
# U3 (docs/ARCHITECTURE_UPLIFT_PLAN.md): structure_wrangler.py imports
# publisher_structure.rules -- declare it so CI breaks loudly if packaging ever
# changes, instead of production breaking quietly on one PYTHONPATH. Enforced by
# tools/lint_service_deps.py in CI.
# publisher-prepress: runtime.py's `scan_pagemap` tool calls
# publisher_prepress.preflight.scan_composition -- the SAME function the delivery
# gate runs -- so an agent and the gate cannot disagree about what a defect is.
dependencies = ["publisher-structure", "publisher-prepress"]
optional-dependencies = {test = ["pytest>=8.0"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_agents*"]
