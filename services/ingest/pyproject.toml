[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-ingest"
version = "0.1.0"
description = "Manuscript ingestion — DOCX to canonical AST"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1",
]
optional-dependencies = {test = ["pytest>=8.0"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_ingest*"]
