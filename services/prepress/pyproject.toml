[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-prepress"
version = "0.1.0"
description = "Prepress module — geometry, preflight rules, font vault, vendor profiles"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]
optional-dependencies = {test = ["pytest>=8.0"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["publisher_prepress*"]
